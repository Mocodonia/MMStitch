<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMStitch</title>

  <!-- IMPORTANT: load CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- OPTIONAL: add this so your debug code has something to write to -->
  <div id="debug" class="debug"></div>

  <!-- Upload grid (your existing markup) -->
  <div class="upload-grid">
    <div class="upload-box" id="box-front">
      <input type="file" id="input-front" accept="image/*" style="display:none;">
      <div class="content"><div class="icon">📷</div><div class="name">Front</div></div>
      <img class="thumb" id="thumb-front" style="display:none;">
    </div>

    <!-- keep the rest of your boxes exactly as you have them ... -->
  </div>

  <script>
  (function() {
    const FACES = [
      'front', 'frontright', 'right', 'backright', 'back',
      'backleft', 'left', 'frontleft',
      'top', 'bottom'
    ];

    window.uploadedImages = {};

    function updateUploadStatus() {
      const status = document.getElementById('status');
      const progress = document.getElementById('progress');
      const stitchBtn = document.getElementById('btn-stitch');

      const uploaded = FACES.filter(f => window.uploadedImages[f]).length;

      if (status) status.textContent = uploaded + '/10 images uploaded';
      if (progress) progress.style.width = (uploaded / 10 * 100) + '%';
      if (stitchBtn) stitchBtn.disabled = uploaded < 3;
    }

    function setupUploads() {
      FACES.forEach(face => {
        const box = document.getElementById('box-' + face);
        const input = document.getElementById('input-' + face);
        const thumb = document.getElementById('thumb-' + face);
        if (!box || !input || !thumb) return;

        box.addEventListener('click', () => input.click());

        input.addEventListener('change', e => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          if (!file.type.startsWith('image/')) {
            alert('Please upload an image file');
            return;
          }

          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
              window.uploadedImages[face] = img;
              thumb.src = ev.target.result;
              thumb.style.display = 'block';
              box.classList.add('has-image');
              updateUploadStatus();
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      });

      updateUploadStatus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const debug = document.getElementById('debug');
      if (debug) {
        debug.textContent = 'Upload logic loaded ✓ (10-slot Cam360 mode)';
        debug.style.background = 'rgba(16, 185, 129, 0.3)';
      }
      setupUploads();
    });
  })();
  </script>
</body>
</html>
