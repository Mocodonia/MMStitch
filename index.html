<script>
(function() {
    const debug = document.getElementById('debug');
    debug.textContent = 'Upload logic loaded ✓ (10‑slot Cam360 mode)';
    debug.style.background = 'rgba(16, 185, 129, 0.3)';

    const FACES = [
        'front', 'frontright', 'right', 'backright', 'back',
        'backleft', 'left', 'frontleft',
        'top', 'bottom'
    ];

    window.uploadedImages = {};

    function updateUploadStatus() {
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const stitchBtn = document.getElementById('btn-stitch');

        const uploaded = FACES.filter(f => window.uploadedImages[f]).length;
        status.textContent = uploaded + '/10 images uploaded';
        progress.style.width = (uploaded / 10 * 100) + '%';

        stitchBtn.disabled = uploaded < 3;
    }

    function setupUploads() {
        FACES.forEach(face => {
            const box = document.getElementById('box-' + face);
            const input = document.getElementById('input-' + face);
            const thumb = document.getElementById('thumb-' + face);
            if (!box || !input || !thumb) return;

            box.addEventListener('click', () => input.click());

            input.addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    alert('Please upload an image file');
                    return;
                }

                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        window.uploadedImages[face] = img;
                        thumb.src = ev.target.result;
                        thumb.style.display = 'block';
                        box.classList.add('has-image');
                        updateUploadStatus();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        updateUploadStatus();
    }

    function clearUploads() {
        window.uploadedImages = {};
        FACES.forEach(face => {
            const input = document.getElementById('input-' + face);
            const box = document.getElementById('box-' + face);
            const thumb = document.getElementById('thumb-' + face);

            if (input) input.value = '';
            if (box) box.classList.remove('has-image');
            if (thumb) {
                thumb.src = '';
                thumb.style.display = 'none';
            }
        });
        updateUploadStatus();
    }

    window.clearUploads = clearUploads;
    document.addEventListener('DOMContentLoaded', setupUploads);
})();
</script>
